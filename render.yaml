# Render Blueprint: lets you deploy this bot on Render's free tier in one click
# (Render dashboard -> New -> Blueprint -> pick this repo).
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web # free tier is only available for web services (not background workers)
    name: discord-musicbot
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    # Registers the slash commands with Discord, then starts the bot
    startCommand: npm run deploy-and-start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # sync: false = Render asks you for these values when creating the service
      - key: TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: CLIENT_SECRET
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: LAVALINK_HOST
        sync: false
      - key: LAVALINK_PORT
        sync: false
      - key: LAVALINK_PASSWORD
        sync: false
      - key: LAVALINK_SECURE
        sync: false
      # Optional: YouTube login token for your own Lavalink server (see HOSTING.md)
      - key: YOUTUBE_REFRESH_TOKEN
        sync: false
      # Optional backup Lavalink server (leave blank in Render if you don't have one)
      - key: LAVALINK2_HOST
        sync: false
      - key: LAVALINK2_PORT
        sync: false
      - key: LAVALINK2_PASSWORD
        sync: false
      - key: LAVALINK2_SECURE
        sync: false
      # Random value generated by Render for signing dashboard cookies
      - key: COOKIE_SECRET
        generateValue: true
